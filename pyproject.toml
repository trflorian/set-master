[project]
name = "set-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86,<5",
]

[project.optional-dependencies]
training = [
    "dinov3",
    "albumentations>=2.0.8,<3",
    "opencv-python-headless>=4.11.0.86,<5",
    "lightning>=2.5",
    "pycocotools>=2.0.10",
    "torch>=2.7,<2.15",
    "torchmetrics>=1.7",
    "torchvision>=0.22",
    "wandb>=0.22",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.17.1"]

[tool.uv.sources]
dinov3 = { path = "src/dinov3", editable = true }
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.basedpyright]
extraPaths = ["src", "src/dinov3"]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
