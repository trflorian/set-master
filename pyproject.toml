[project]
name = "set-master"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.1.0",
    "ipywidgets>=8.1.8",
    "numpy>=2.3.4",
    "opencv-python>=4.11.0.86",
]

[project.optional-dependencies]
training = [
    "lightning>=2.5",
    "pycocotools>=2.0.10",
    "torch>=2.7",
    "torchmetrics>=1.7",
    "torchvision>=0.22",
]

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
